version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nakedret
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - whitespace
  settings:
    testifylint:
      disable-all: true
      enable:
        - empty
        - go-require
        - len
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    modernize:
      # Only the `any` analyzer is adopted; list new suite members here on upgrade.
      disable:
        - atomictypes
        - embedlit
        - errorsastype
        - forvar
        - importcomment
        - mapsloop
        - minmax
        - newexpr
        - omitzero
        - plusbuild
        - rangeint
        - reflecttypeassert
        - reflecttypefor
        - slicesbackward
        - slicesclip
        - slicescontains
        - slicessort
        - stditerators
        - stringsbuilder
        - stringscut
        - stringscutprefix
        - stringsseq
        - testingcontext
        - unsafefuncs
        - waitgroupgo
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - unused
        path: server/configuration.go
      - linters:
          - bodyclose
          - scopelint
          - gosec
        path: _test\.go
      # Local dev tooling: operator-supplied paths/URLs/log values are by design.
      - linters:
          - gosec
        path: ^build/
        text: "G70[346]"
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - errcheck
        text: c.Abort
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mattermost/mattermost-starter-template
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
